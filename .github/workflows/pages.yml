# Проверяет каркас и публикует проверенную сборку с базовым путём GitHub Pages.
name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Публикации идут по очереди; проверки разных PR не блокируют основную ветку.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Проверки и сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Playwright 1.63.0-noble: браузеры и библиотеки уже установлены в образе.
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --init --ipc=host
    steps:
      - name: Получить полную Git-историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Установить зафиксированные зависимости
        run: npm ci

      - name: Проверить лимит обязательного набора E2E
        run: node scripts/check-e2e-budget.mjs

      - name: Проверить форматирование
        run: npm run fmt:check

      - name: Проверить код линтером
        run: npm run lint

      - name: Проверить типы
        run: npm run typecheck

      - name: Проверить unit-тесты и блокировку ошибочной сборки
        run: npm run test

      - name: Проверить MDX, формулы и изоляцию тестовых материалов
        run: npm run test:mdx

      - name: Проверить материалы, ссылки, якоря, нумерацию и изоляцию служебных статей
        run: npm run test:articles

      # Проверяет обе сборки и Pagefind; Playwright запускает явно выбранные сценарии CI.
      - name: Собрать и проверить сайт в корне и под префиксом
        run: npm run test:e2e

      - name: Настроить GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Публикуется именно артефакт, проверенный Playwright; повторной сборки нет.
      - name: Загрузить проверенный артефакт
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .e2e/prefixed

  deploy:
    name: Деплой GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать проверенный артефакт
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
