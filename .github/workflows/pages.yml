# Проверяет каркас параллельными заданиями и публикует проверенную сборку с базовым путём GitHub Pages.
name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Публикации идут по очереди; проверки разных PR не блокируют основную ветку.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Этап 1: быстрая статическая проверка; долгие задания запускаются только после её успеха.
  static:
    name: Форматирование, линтер и типы
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Получить полную Git-историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Установить зафиксированные зависимости
        run: npm ci

      - name: Проверить лимит обязательного набора E2E
        run: node scripts/check-e2e-budget.mjs

      - name: Проверить форматирование
        run: npm run fmt:check

      - name: Проверить код линтером
        run: npm run lint

      - name: Проверить типы
        run: npm run typecheck

  # Параллельно с этапом 1: unit-тесты не блокируют этап 2, но обязательны для деплоя.
  unit:
    name: Unit-тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Получить полную Git-историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Установить зафиксированные зависимости
        run: npm ci

      - name: Проверить unit-тесты и блокировку ошибочной сборки
        run: npm run test

  # Этап 2: долгие проверки идут параллельно после успеха `static`.
  mdx:
    name: MDX и формулы (${{ matrix.part }})
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        part: [root, prefixed]
    steps:
      - name: Получить полную Git-историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Установить зафиксированные зависимости
        run: npm ci

      - name: Проверить MDX, формулы и изоляцию тестовых материалов
        run: npm run test:mdx -- --part=${{ matrix.part }}

  articles:
    name: Материалы и ссылки
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 8
    steps:
      - name: Получить полную Git-историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Установить зафиксированные зависимости
        run: npm ci

      - name: Проверить материалы, ссылки, якоря, нумерацию и изоляцию служебных статей
        run: npm run test:articles

  tracks:
    name: Треки
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 8
    steps:
      - name: Получить полную Git-историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Установить зафиксированные зависимости
        run: npm ci

      - name: Проверить треки, ошибочные цели и изоляцию служебных маршрутов
        run: npm run test:tracks

  track-updates:
    name: Журнал и страницы треков в браузере (${{ matrix.placement }})
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        placement: [root, prefixed]
    # Playwright 1.63.0-noble: браузеры и библиотеки уже установлены в образе.
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --init --ipc=host
    steps:
      - name: Получить полную Git-историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Установить зафиксированные зависимости
        run: npm ci

      - name: Проверить страницы и журнал треков на служебных маршрутах
        env:
          PLACEMENT: ${{ matrix.placement }}
        run: npm run test:track-updates

  build:
    name: Сборка и браузерные проверки (${{ matrix.placement }})
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        placement: [root, prefixed]
    # Playwright 1.63.0-noble: браузеры и библиотеки уже установлены в образе.
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --init --ipc=host
    steps:
      - name: Получить полную Git-историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Установить зафиксированные зависимости
        run: npm ci

      - name: Собрать и проверить сайт (${{ matrix.placement }})
        env:
          PLACEMENT: ${{ matrix.placement }}
        run: npm run test:e2e:ci:${{ matrix.placement }}

      - name: Настроить GitHub Pages
        if: matrix.placement == 'prefixed' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Проверить публичную сборку без служебных материалов
        if: matrix.placement == 'prefixed'
        run: npm run test:published

      # Публикуется именно артефакт, проверенный Playwright; повторной сборки нет.
      - name: Загрузить проверенный артефакт
        if: matrix.placement == 'prefixed' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .e2e/prefixed

  deploy:
    name: Деплой GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Этап 3: публикация ждёт этап 2 целиком (он сам идёт после этапа 1).
    needs: [unit, mdx, articles, tracks, track-updates, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать проверенный артефакт
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
